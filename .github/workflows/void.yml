on:
  push:
    tags:
      - void/*
jobs:
  build-void:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./void.sh
        env:
          # https://github.com/void-linux/void-packages/blob/master/srcpkgs/linux/template
          # https://github.com/void-linux/void-packages/tree/master/srcpkgs/linux6.18
          VOID_PACKAGES_COMMIT: d26a16149bf0347d8498b909e8febe6576483b20
          VOID_PACKAGE: linux6.18
          # https://github.com/void-linux/void-containers/pkgs/container/void-glibc-full
          VOID_TAG: 20260501r1
          # https://hub.docker.com/_/debian
          DEBIAN_TAG: unstable-20260421
      - uses: actions/upload-artifact@v7
        with:
          name: void
          path: |
            builddir/*.deb
            builddir/linux-upstream_*.*
  attest-void:
    runs-on: ubuntu-24.04
    needs: build-void
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: void
      - uses: actions/attest@v4
        with:
          subject-path: linux-upstream_*.changes
  release-void:
    runs-on: ubuntu-24.04
    needs: attest-void
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: void
      - run: gh -R ${{ github.repository }} release create ${{ github.ref_name }} *.deb linux-upstream_*.*
        env:
          GITHUB_TOKEN: ${{ github.token }}
