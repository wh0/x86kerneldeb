on:
  push:
    tags:
      - alpine-lts/*
jobs:
  build-alpine-lts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./alpine.sh
        env:
          # https://gitlab.alpinelinux.org/alpine/aports/-/tree/master/main/linux-lts
          APORTS_COMMIT: 96dd49971b76c19ba48c27271ba19cbee0ada98a
          # https://hub.docker.com/_/alpine
          ALPINE_TAG: 20260127
          # https://hub.docker.com/_/debian
          DEBIAN_TAG: unstable-20260421
      - uses: actions/upload-artifact@v7
        with:
          name: alpine-lts
          path: |
            aports/main/linux-lts/src/*.deb
            aports/main/linux-lts/src/linux-upstream_*.*
  attest-alpine-lts:
    runs-on: ubuntu-24.04
    needs: build-alpine-lts
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: alpine-lts
      - uses: actions/attest@v4
        with:
          subject-path: linux-upstream_*.changes
  release-alpine-lts:
    runs-on: ubuntu-24.04
    needs: attest-alpine-lts
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: alpine-lts
      - run: gh -R ${{ github.repository }} release create ${{ github.ref_name }} *.deb linux-upstream_*.*
        env:
          GITHUB_TOKEN: ${{ github.token }}
