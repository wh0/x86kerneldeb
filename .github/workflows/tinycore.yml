on:
  push:
    tags:
      - tinycore/*
jobs:
  build-tinycore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./tinycore.sh
        env:
          # http://tinycorelinux.net/17.x/x86/release/src/kernel/
          TINYCORE_SRC_KERNEL_LINUX_PATCHED_PATH: 17.x/x86/release/src/kernel/linux-6.18.2-patched.tar.xz
          TINYCORE_SRC_KERNEL_CONFIG_PATH: 17.x/x86/release/src/kernel/config-6.18.2-tinycore
          TINYCORE_SRC_KERNEL_LINUX_PATCHED_SHA256: 6704e6bef3712da298c5d2dba01c51833848eaa102256231e0b162cb1093e28c
          TINYCORE_SRC_KERNEL_CONFIG_SHA256: accdc7d2f573866b8cdf722e0bce9348a40968b93c5d3a9f475a5cdf2738427c
          # https://hub.docker.com/_/debian
          DEBIAN_TAG: unstable-20260421
      - uses: actions/upload-artifact@v7
        with:
          name: tinycore
          path: |
            tinycore/*.deb
            tinycore/linux-upstream_*.*
  attest-tinycore:
    runs-on: ubuntu-24.04
    needs: build-tinycore
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tinycore
      - uses: actions/attest@v4
        with:
          subject-path: linux-upstream_*.changes
  release-tinycore:
    runs-on: ubuntu-24.04
    needs: attest-tinycore
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tinycore
      - run: gh -R ${{ github.repository }} release create ${{ github.ref_name }} *.deb linux-upstream_*.*
        env:
          GITHUB_TOKEN: ${{ github.token }}
